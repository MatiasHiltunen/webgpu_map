<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGPU Map MVP demo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: grab;
    }

    #map:active { cursor: grabbing; }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      pointer-events: none;
      white-space: pre;
    }

    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
      background: #151515;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: left;
      white-space: pre-wrap;
    }

    #osm-attribution {
      position: fixed;
      z-index: 1;
      right: 10px;
      bottom: 8px;
      max-width: min(100vw - 20px, 32em);
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.88);
      font: 11px/1.35 system-ui, -apple-system, sans-serif;
      text-align: right;
      pointer-events: none;
    }

    #osm-attribution a {
      color: #9cf;
      text-decoration: underline;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div id="hud"></div>
  <div id="error"></div>
  <footer id="osm-attribution" aria-label="Map data attribution">
    Map: ©
    <a href="https://www.openstreetmap.org/copyright" rel="license noreferrer" target="_blank" title="OpenStreetMap legal">OpenStreetMap</a>
    contributors
  </footer>

  <script type="module" src="./dist/demo/main.js"></script>
</body>
</html>
